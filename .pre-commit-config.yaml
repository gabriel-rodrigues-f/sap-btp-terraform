# Checagens rápidas ANTES do commit (o CI repete tudo).
# Ativar: .venv/bin/pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # bloqueia commit de senha/token por engano

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/terraform/.tflint.hcl]

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: bash -c 'cd ansible && PATH="../.venv/bin:$PATH" ansible-lint'
        language: system
        files: ^ansible/
        pass_filenames: false
