# Config versionada junto com o código: qualquer pessoa que rodar de dentro de
# ansible/ terá o mesmo comportamento (o Ansible lê o ansible.cfg do diretório atual).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Coleções instaladas DENTRO do repo (make setup), na versão do requirements.yml.
collections_path = collections
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
# Mostra quanto tempo cada task levou (útil para entender o que é lento no BTP).
callbacks_enabled = ansible.posix.profile_tasks, ansible.builtin.timer

[inventory]
enable_plugins = yaml
