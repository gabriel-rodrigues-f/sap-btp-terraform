---
# Configuração e governança sobre o que o Terraform criou:
#   preflight -> contexto (outputs do Terraform) -> login no CF
#   -> labels na org (lacuna do Terraform) -> auditoria de FinOps
#
# Uso (de dentro de ansible/):
#   ansible-playbook playbooks/site.yml            # aplica
#   ansible-playbook playbooks/site.yml --check    # mostra o que mudaria

- name: Complete and audit the SAP BTP Cloud Foundry org
  hosts: btp_control
  gather_facts: false

  roles:
    - role: preflight

    - role: btp_context

    - role: cf_target
      vars:
        cf_target_api_url: "{{ btp_context_info.cf_api_url }}"
        cf_target_org: "{{ btp_context_info.cf_org_name }}"
        cf_target_expected_user: "{{ btp_context_info.deployer }}"

    - role: cf_org_metadata
      vars:
        cf_org_metadata_org_id: "{{ btp_context_info.cf_org_id }}"
        cf_org_metadata_labels: "{{ btp_context_info.cf_org_metadata.labels }}"
        cf_org_metadata_annotations: "{{ btp_context_info.cf_org_metadata.annotations }}"

    - role: finops_compliance
      vars:
        finops_compliance_org_id: "{{ btp_context_info.cf_org_id }}"
        finops_compliance_required_keys: "{{ btp_context_info.required_label_keys }}"
