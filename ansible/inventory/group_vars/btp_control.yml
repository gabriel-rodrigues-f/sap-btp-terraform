---
# Parâmetros do AMBIENTE. O "onde" (org, spaces, serviços) e o "como rotular"
# (labels de FinOps) NÃO ficam aqui: vêm dos outputs do Terraform.

# Auditoria de FinOps: falhar o playbook se algum recurso estiver sem label obrigatória.
finops_compliance_enforce: true

# Credenciais: SEMPRE do ambiente, as mesmas usadas pelo Terraform.
# Nunca escreva usuário/senha aqui.
cf_target_username: "{{ lookup('ansible.builtin.env', 'BTP_USERNAME', default='') }}"
cf_target_password: "{{ lookup('ansible.builtin.env', 'BTP_PASSWORD', default='') }}"
