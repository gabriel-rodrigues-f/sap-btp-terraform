---
# No BTP não há servidores para acessar por SSH: tudo é API.
# Por isso o "host" é a própria máquina de controle (localhost), que conversa
# com o BTP via cf CLI e HTTP. Em CI, é o runner do pipeline.
all:
  children:
    btp_control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
