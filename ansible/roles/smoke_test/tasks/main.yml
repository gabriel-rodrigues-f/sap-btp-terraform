---
# Deploy só termina quando a app RESPONDE. Este teste cruza as duas camadas:
# a destination foi criada pelo Terraform e é lida pela app implantada pelo Ansible.

- name: Wait until the health endpoint answers
  ansible.builtin.uri:
    url: "{{ smoke_test_base_url }}/health"
    return_content: true
  register: smoke_test_health
  until: smoke_test_health.status == 200
  retries: "{{ smoke_test_retries }}"
  delay: "{{ smoke_test_delay }}"

- name: Read the destination through the app
  ansible.builtin.uri:
    url: "{{ smoke_test_base_url }}/destination"
    return_content: true
  register: smoke_test_destination

- name: Ensure the app resolved the destination created by Terraform
  ansible.builtin.assert:
    that:
      - smoke_test_destination.json.name == smoke_test_destination_name
    fail_msg: "A app respondeu, mas não leu a destination {{ smoke_test_destination_name }}: {{ smoke_test_destination.json }}"
    success_msg: "OK: {{ smoke_test_destination.json.name }} -> {{ smoke_test_destination.json.url }}"

- name: Show where the app is running
  ansible.builtin.debug:
    msg: "App no ar: {{ smoke_test_base_url }}  (rotas: /, /health, /destination)"
