---
argument_specs:
  main:
    short_description: Audita labels de FinOps na org Cloud Foundry e gera inventário CSV.
    options:
      finops_compliance_org_id:
        type: str
        required: true
        description: GUID da org (output do Terraform).
      finops_compliance_required_keys:
        type: list
        elements: str
        required: true
        description: Chaves de label obrigatórias (output do Terraform).
      finops_compliance_report_dir:
        type: path
        description: Diretório do relatório.
      finops_compliance_enforce:
        type: bool
        default: true
        description: Falha o playbook se houver recurso fora do padrão.
