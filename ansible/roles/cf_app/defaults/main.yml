---
cf_app_name: hello-btp
cf_app_source_dir: "{{ playbook_dir | dirname | dirname }}/app/{{ cf_app_name }}"
# Manifesto gerado fica fora do código-fonte (e fora do git).
cf_app_build_dir: "{{ playbook_dir | dirname | dirname }}/.build/{{ cf_app_name }}"

cf_app_buildpack: nodejs_buildpack
cf_app_memory: 128M
cf_app_disk_quota: 256M
cf_app_instances: 1
cf_app_health_check_endpoint: /health

# Serviços (nomes das instâncias) para bind e variáveis de ambiente da app.
cf_app_services: []
cf_app_env: {}

# rolling = zero downtime: novas instâncias sobem antes das antigas pararem.
cf_app_strategy: rolling

# true = faz push mesmo sem mudança detectada (ex.: atualizar o buildpack).
cf_app_force_push: false
