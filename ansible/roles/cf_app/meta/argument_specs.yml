---
argument_specs:
  main:
    short_description: Faz deploy idempotente de uma app no Cloud Foundry.
    description:
      - Calcula um digest (código + configuração) e só executa `cf push` quando ele muda.
      - O digest fica gravado como annotation da app no Cloud Foundry.
    options:
      cf_app_name:
        type: str
        default: hello-btp
        description: Nome da app no Cloud Foundry.
      cf_app_space_id:
        type: str
        required: true
        description: GUID do space (output do Terraform).
      cf_app_route:
        type: str
        required: true
        description: Rota completa (host.domínio) da app.
      cf_app_source_dir:
        type: path
        description: Diretório com o código da app.
      cf_app_build_dir:
        type: path
        description: Onde o manifesto gerado é gravado.
      cf_app_buildpack:
        type: str
        default: nodejs_buildpack
        description: Buildpack do Cloud Foundry.
      cf_app_memory:
        type: str
        default: 128M
        description: Memória por instância.
      cf_app_disk_quota:
        type: str
        default: 256M
        description: Disco por instância.
      cf_app_instances:
        type: int
        default: 1
        description: Número de instâncias.
      cf_app_health_check_endpoint:
        type: str
        default: /health
        description: Endpoint HTTP do health check.
      cf_app_services:
        type: list
        elements: str
        default: []
        description: Nomes das instâncias de serviço para bind.
      cf_app_env:
        type: dict
        default: {}
        description: Variáveis de ambiente da app (não coloque segredos aqui).
      cf_app_strategy:
        type: str
        default: rolling
        choices: [rolling, canary]
        description: Estratégia de deploy do `cf push`.
      cf_app_force_push:
        type: bool
        default: false
        description: Força o push mesmo sem mudança de digest.
