---
# `cf push` NÃO é idempotente: sempre reconstrói e reinicia a app.
# Para que rodar o playbook duas vezes não cause um redeploy à toa, calculamos
# um digest de (código + configuração) e comparamos com a annotation gravada
# na app no último deploy. Só há push quando algo mudou.

- name: Compute a digest of the application source code
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      find . -type f -not -path './node_modules/*' -print0
      | LC_ALL=C sort -z
      | xargs -0 shasum -a 256
      | shasum -a 256
      | cut -d' ' -f1
    chdir: "{{ cf_app_source_dir }}"
    executable: /bin/bash
  register: cf_app_source_digest
  changed_when: false
  check_mode: false

- name: Combine source and configuration into a single deployment digest
  vars:
    cf_app_settings:
      buildpack: "{{ cf_app_buildpack }}"
      memory: "{{ cf_app_memory }}"
      disk_quota: "{{ cf_app_disk_quota }}"
      instances: "{{ cf_app_instances }}"
      health_check: "{{ cf_app_health_check_endpoint }}"
      route: "{{ cf_app_route }}"
      services: "{{ cf_app_services | sort }}"
      env: "{{ cf_app_env }}"
      # Mudou o template do manifesto? Também é motivo para novo deploy.
      template: "{{ lookup('ansible.builtin.file', role_path ~ '/templates/manifest.yml.j2') | hash('sha1') }}"
  ansible.builtin.set_fact:
    cf_app_digest: "{{ (cf_app_source_digest.stdout ~ (cf_app_settings | to_json(sort_keys=true))) | hash('sha1') }}"

- name: Ensure the build directory exists
  ansible.builtin.file:
    path: "{{ cf_app_build_dir }}"
    state: directory
    mode: "0755"

- name: Render the Cloud Foundry manifest
  ansible.builtin.template:
    src: manifest.yml.j2
    dest: "{{ cf_app_build_dir }}/manifest.yml"
    mode: "0644"

- name: Look up the app currently deployed in the space
  ansible.builtin.command:
    argv:
      - cf
      - curl
      - "/v3/apps?names={{ cf_app_name }}&space_guids={{ cf_app_space_id }}"
  register: cf_app_lookup
  changed_when: false
  check_mode: false

- name: Read the digest of the deployed version
  vars:
    cf_app_existing: "{{ (cf_app_lookup.stdout | from_json).resources }}"
  ansible.builtin.set_fact:
    cf_app_deployed_digest: >-
      {{ cf_app_existing[0].metadata.annotations['deploy-digest'] | default('')
         if cf_app_existing | length > 0 else '' }}

- name: Push the application with strategy {{ cf_app_strategy }}
  ansible.builtin.command:
    argv:
      - cf
      - push
      - -f
      - "{{ cf_app_build_dir }}/manifest.yml"
      - --strategy
      - "{{ cf_app_strategy }}"
  when: cf_app_digest != cf_app_deployed_digest or cf_app_force_push
  register: cf_app_push
  changed_when: true

- name: Report the deployment decision
  ansible.builtin.debug:
    msg: >-
      {{ 'Deploy executado' if cf_app_push is changed else 'Nada mudou, push ignorado' }}
      (digest {{ cf_app_digest[:12] }}).
