---
# Autentica o cf CLI (usuário/senha) e aponta para a org/space criados pelo
# Terraform. Cada execução define o endpoint explicitamente: um `cf push` na
# org errada é um dos erros mais comuns (e caros).

- name: Fail with guidance when credentials are missing
  ansible.builtin.fail:
    msg: >-
      Credenciais ausentes. Exporte BTP_USERNAME e BTP_PASSWORD no shell
      (veja docs/02-autenticacao.md).
  when: cf_target_username | length == 0 or cf_target_password | length == 0

- name: Point the cf CLI to the API endpoint created by Terraform
  ansible.builtin.command:
    argv: [cf, api, "{{ cf_target_api_url }}"]
  # Só muda o contexto LOCAL do CLI (~/.cf/config.json), nada no BTP.
  changed_when: false
  check_mode: false

- name: Authenticate with username and password
  ansible.builtin.command:
    argv: [cf, auth]
  environment:
    # Via ambiente, a senha não aparece na lista de processos (como apareceria em argv).
    CF_USERNAME: "{{ cf_target_username }}"
    CF_PASSWORD: "{{ cf_target_password }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Target the org (and space, when given) created by Terraform
  ansible.builtin.command:
    argv: "{{ ['cf', 'target', '-o', cf_target_org] + (['-s', cf_target_space] if cf_target_space | length > 0 else []) }}"
  changed_when: false
  check_mode: false
