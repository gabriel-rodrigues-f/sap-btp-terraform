---
# argument_specs: o Ansible valida as entradas da role ANTES de executá-la.
argument_specs:
  main:
    short_description: Autentica o cf CLI e aponta para a org/space corretos.
    options:
      cf_target_api_url:
        type: str
        required: true
        description: Endpoint da API Cloud Foundry (output do Terraform).
      cf_target_org:
        type: str
        required: true
        description: Nome da org.
      cf_target_space:
        type: str
        default: ""
        description: Nome do space (opcional; vazio = só a org).
      cf_target_username:
        type: str
        required: true
        description: Usuário do SAP ID service (vem de BTP_USERNAME).
      cf_target_password:
        type: str
        required: true
        no_log: true
        description: Senha (vem de BTP_PASSWORD). Nunca em arquivo.
